name: Pipeline

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: pipeline-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    name: verify (Node 24.x)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run verify
      - name: Pack release artifact
        run: npm pack --json --ignore-scripts --pack-destination package
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: npm-package
          path: package/*.tgz
          if-no-files-found: error

  consumer-compatibility:
    name: consumer compatibility (Node 20.19.0)
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 20.19.0
          cache: npm
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: npm-package
          path: package
      - run: node scripts/test-package.mjs package/*.tgz

  windows-verify:
    name: verify on Windows (Node 24.x)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run verify

  publish:
    name: release npm
    needs: [verify, windows-verify, consumer-compatibility]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: npm-publish
    permissions:
      contents: write
      id-token: write
    concurrency:
      group: npm-publish
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - name: Install npm with Trusted Publishing support
        run: npm install --global npm@latest
      - run: npm --version
      - name: Determine version and publish
        run: npm exec --yes --package=semantic-release@25.0.9 -- semantic-release
      - name: Synchronize package version from npm
        shell: bash
        run: |
          package_name="$(node -p 'require("./package.json").name')"
          published_version="$(npm view "${package_name}" version)"
          npm version "${published_version}" --no-git-tag-version --ignore-scripts --allow-same-version

          if git diff --quiet -- package.json package-lock.json; then
            exit 0
          fi

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package.json package-lock.json
          git commit --message "chore(release): sync package version to ${published_version} [skip ci]"
          git push origin "HEAD:${GITHUB_REF_NAME}"
