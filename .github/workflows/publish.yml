name: Pipeline

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: pipeline-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: test (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [18.x, 20.x, 22.x]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run lint
      - run: npm run format:check
      - run: npm run pack:check

  publish:
    name: release npm
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: npm-publish
    permissions:
      contents: write
      id-token: write
    concurrency:
      group: npm-publish
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24.x
          package-manager-cache: false
      - name: Install npm with Trusted Publishing support
        run: npm install --global npm@latest
      - run: npm --version
      - name: Establish the npm release baseline once
        shell: bash
        run: |
          package_name="$(node -p 'require("./package.json").name')"
          published_version="$(npm view "${package_name}" version)"
          baseline_tag="v${published_version}"
          if git rev-parse --verify --quiet "refs/tags/${baseline_tag}"; then
            exit 0
          fi
          baseline_commit="$(git log -n 1 --format=%H -- package.json)"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git tag --annotate "${baseline_tag}" "${baseline_commit}" --message "Release ${baseline_tag}"
          git push origin "${baseline_tag}"
      - name: Determine version and publish
        run: npm exec --yes --package=semantic-release@25.0.9 -- semantic-release
